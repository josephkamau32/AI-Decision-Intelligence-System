services:
  - type: web
    name: decisera-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
      - key: PYTHONPATH
        value: .
      - key: DEBUG_MODE
        value: "false"
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /api/v1/health

