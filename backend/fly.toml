# Fly.io deployment configuration
app = "decisera-backend"
primary_region = "cdg"  # Paris - change to your preferred region

# Build configuration
[build]

# HTTP service configuration
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Health check
  [http_service.checks]
    [http_service.checks.health]
      grace_period = "10s"
      interval = "30s"
      method = "GET"
      timeout = "5s"
      path = "/health"

# Environment variables (non-secret)
[env]
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  PORT = "8000"

# VM configuration
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Persistent storage for models and data
[mounts]
  source = "decisera_data"
  destination = "/app/data"
  initial_size = "1gb"

# Deploy configuration
[deploy]
  release_command = "python -m backend.utils.init_db"  # Optional: run DB migrations
